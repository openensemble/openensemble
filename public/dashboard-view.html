  <div class="app-shell" id="dashboardThemeRoot">
    <aside class="sidebar" id="sidebar">
      <div class="brand" id="dashboardBrand"><span class="brand-mark"><svg><use href="#i-house"></use></svg></span><div><strong>OpenEnsemble</strong><small>Dashboard</small></div></div>
      <button class="dashboard-switcher" id="dashboardSwitcher" type="button" aria-label="Dashboard identity" disabled hidden>
        <span class="dashboard-switcher-icon"><svg><use href="#i-grid"></use></svg></span>
        <span class="dashboard-switcher-copy"><strong id="currentDashboardName">Home</strong><small id="currentDashboardOwner">Loading profile…</small></span>
        <svg class="dashboard-switcher-chevron"><use href="#i-chevron-down"></use></svg>
      </button>
      <nav class="side-nav" aria-label="Dashboard navigation">
        <div id="focusNavGroup">
          <div class="nav-label nav-label-first">Focus</div>
          <div id="focusModes"></div>
        </div>
        <div id="sectionNavGroup">
          <div class="nav-label" id="contextNavLabel">Dashboard</div>
          <div id="sideSections"></div>
        </div>
      </nav>
      <div class="sidebar-foot" id="sidebarFoot">
        <div class="ha-status" id="sidebarStatus"><span class="status-dot"></span><div><strong>Connecting</strong><small>Home Assistant</small></div></div>
        <button class="icon-button" id="themeButton" title="Change base theme" aria-label="Change base theme"><svg><use href="#i-sun"></use></svg></button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar" id="topbar">
        <button class="icon-button mobile-menu" id="menuButton" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false"><svg><use href="#i-menu"></use></svg></button>
        <div class="breadcrumbs"><span id="dashboardBreadcrumbName">Home</span><i></i><strong id="activeSpaceLabel">Overview</strong></div>
        <nav class="dashboard-cycle" id="dashboardCycle" aria-label="Switch display dashboard" hidden>
          <button class="icon-button" type="button" data-action="cycle-dashboard" data-direction="previous" aria-label="Previous dashboard" title="Previous dashboard"><svg><use href="#i-chevron-left"></use></svg></button>
          <span id="dashboardCyclePosition" aria-live="polite">1 / 1</span>
          <button class="icon-button" type="button" data-action="cycle-dashboard" data-direction="next" aria-label="Next dashboard" title="Next dashboard"><svg><use href="#i-chevron-right"></use></svg></button>
        </nav>
        <div class="top-actions">
          <span class="save-status" id="saveStatus" aria-live="polite"></span>
          <button class="button secondary" id="fullscreenButton" title="Fullscreen dashboard"><svg><use href="#i-maximize"></use></svg><span>Fullscreen</span></button>
          <button class="button secondary" id="refreshButton"><svg><use href="#i-refresh"></use></svg><span>Refresh</span></button>
          <button class="button secondary" id="customizeButton"><svg><use href="#i-sliders"></use></svg><span>Customize</span></button>
          <button class="button primary" id="addDeviceButton"><svg><use href="#i-plus"></use></svg><span>Add card</span></button>
        </div>
      </header>

      <div class="content" id="content">
        <h1 class="visually-hidden" id="dashboardAccessibleTitle" hidden>Home dashboard</h1>
        <section class="hero" id="hero">
          <div id="heroCopy">
            <div class="eyebrow" id="heroStatus"><span class="live-dot"></span><span id="connectionLabel">Live home</span></div>
            <h1 id="greeting">Good evening.</h1>
            <p id="dashboardTagline">Everything is in its place.</p>
          </div>
          <div class="hero-time" id="heroClock"><strong id="heroTime">—:—</strong><span id="heroDate">Loading</span></div>
        </section>

        <section class="summary-grid" id="summaryGrid" aria-label="Dashboard summary"></section>

        <section class="canvas-toolbar">
          <div class="mobile-spaces" id="mobileSpaces"></div>
          <div class="edit-tools" id="editTools" hidden>
            <button class="button ghost" id="addSectionButton"><svg><use href="#i-folder-plus"></use></svg>New section</button>
            <button class="button ghost" id="dashboardStyleButton"><svg><use href="#i-settings"></use></svg>Dashboard settings</button>
          </div>
        </section>

        <div class="sections" id="sections"></div>
      </div>
    </main>
  </div>

  <button class="icon-button floating-menu" id="floatingMenuButton" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false" hidden><svg><use href="#i-menu"></use></svg></button>

  <button class="fullscreen-exit" id="fullscreenExit" aria-label="Exit fullscreen" title="Exit fullscreen"><svg aria-hidden="true"><use href="#i-minimize"></use></svg></button>

  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
  <aside class="panel" id="panel" aria-hidden="true"></aside>
  <section class="camera-viewer" id="cameraViewer" role="dialog" aria-modal="true" aria-labelledby="cameraViewerTitle" aria-describedby="cameraViewerStatus" aria-hidden="true" hidden>
    <header class="camera-viewer-head">
      <div><span><i></i><b id="cameraViewerKind">Camera viewer</b></span><h2 id="cameraViewerTitle">Camera</h2><p id="cameraViewerStatus" role="status" aria-live="polite">Connecting to camera…</p></div>
      <button class="camera-viewer-close" data-action="close-camera" aria-label="Close full-screen camera"><svg aria-hidden="true"><use href="#i-x"></use></svg></button>
    </header>
    <div class="camera-viewer-stage">
      <video id="cameraViewerVideo" muted autoplay playsinline></video>
      <img id="cameraViewerImage" alt="" decoding="async">
      <div class="camera-viewer-loading"><svg aria-hidden="true"><use href="#i-camera"></use></svg><span id="cameraViewerLoadingText">Connecting to camera…</span><button class="camera-viewer-retry" id="cameraViewerRetry" data-action="retry-camera-live" type="button" hidden><svg aria-hidden="true"><use href="#i-refresh"></use></svg>Retry live view</button></div>
    </div>
  </section>
  <dialog class="device-dialog" id="deviceDialog" aria-labelledby="deviceDialogTitle" aria-describedby="deviceDialogState">
    <div class="device-dialog-surface">
      <header class="device-dialog-head">
        <div class="device-dialog-heading">
          <span>Expanded control</span>
          <h2 id="deviceDialogTitle" tabindex="-1">Device</h2>
          <p id="deviceDialogState" aria-live="polite">Loading current state</p>
        </div>
        <button class="device-dialog-close" data-action="close-device" aria-label="Close expanded control"><svg aria-hidden="true"><use href="#i-x"></use></svg></button>
      </header>
      <div class="device-dialog-card" id="deviceDialogCard"></div>
    </div>
  </dialog>
  <div class="toast-region" id="toastRegion" aria-live="polite"></div>

  <script type="module" src="/dashboard-view.js"></script>
</body>
</html>
